<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>P2 · GraphRAG</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  :root { --accent:#7c5cff; --accent-2:#22d3ee; --accent-3:#f472b6; --bg:#07090f; }
  body { background: var(--bg); color:#e7ecf5; font-family:'Inter', system-ui, sans-serif; }
  .bg-stage { position:fixed; inset:0; z-index:-2; background:
    radial-gradient(1200px 700px at 80% -10%, rgba(124,92,255,0.22), transparent 60%),
    radial-gradient(1000px 600px at -10% 30%, rgba(34,211,238,0.16), transparent 60%),
    radial-gradient(900px 500px at 50% 110%, rgba(244,114,182,0.16), transparent 55%),
    linear-gradient(180deg,#06070d,#0a0e1c); }
  .card { background: rgba(18,20,28,0.7); border:1px solid rgba(255,255,255,0.08); border-radius:14px; backdrop-filter: blur(8px); }
  .pill { display:inline-flex; padding:4px 10px; border-radius:999px; font-size:11px; font-family:'JetBrains Mono',monospace; letter-spacing:0.1em; text-transform:uppercase; }
  .pill.lookup { background:rgba(34,211,238,0.12); color:#22d3ee; border:1px solid rgba(34,211,238,0.3); }
  .pill.multi_hop { background:rgba(124,92,255,0.12); color:#7c5cff; border:1px solid rgba(124,92,255,0.3); }
  .pill.aggregation { background:rgba(244,114,182,0.12); color:#f472b6; border:1px solid rgba(244,114,182,0.3); }
  .pill.hybrid { background:rgba(251,191,36,0.12); color:#fbbf24; border:1px solid rgba(251,191,36,0.3); }
  .brand { font-family:'JetBrains Mono',monospace; letter-spacing:0.2em; background: linear-gradient(90deg, var(--accent-2), var(--accent)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  #graph { height: 480px; background: rgba(0,0,0,0.3); border-radius: 10px; }
</style>
</head>
<body>
<div class="bg-stage"></div>

<nav class="border-b border-white/5 backdrop-blur sticky top-0 z-10 bg-black/40">
  <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
    <div class="brand text-sm">// P2 · KNOWLEDGE OS</div>
    <div class="text-xs text-white/40 font-mono">backend: <span id="backend-status">checking...</span></div>
  </div>
</nav>

<main class="max-w-6xl mx-auto px-6 py-10 space-y-6">

  <header>
    <h1 class="text-4xl font-bold tracking-tight">GraphRAG over an enterprise knowledge graph</h1>
    <p class="text-white/60 mt-2 max-w-2xl">Ask a question. The router classifies it (<em>lookup / multi_hop / aggregation / hybrid</em>) and dispatches to the right execution path.</p>
  </header>

  <section class="card p-6">
    <div class="flex gap-3">
      <input id="q" type="text" class="flex-1 bg-black/40 border border-white/10 rounded px-3 py-2 text-sm" placeholder="e.g. Which projects depend on contracts signed by Alice Johnson?" />
      <button id="ask" class="px-6 py-2 rounded-lg font-semibold text-sm bg-gradient-to-r from-[#7c5cff] to-[#22d3ee] text-[#0b0f1f]">Ask</button>
    </div>
    <div class="mt-3 flex gap-2 flex-wrap text-xs">
      <button class="example px-3 py-1 rounded border border-white/10 hover:bg-white/5">What is the SLA for tier 1 support?</button>
      <button class="example px-3 py-1 rounded border border-white/10 hover:bg-white/5">Which projects depend on contracts signed by Alice?</button>
      <button class="example px-3 py-1 rounded border border-white/10 hover:bg-white/5">How many deals are in EMEA?</button>
    </div>
  </section>

  <div class="grid md:grid-cols-3 gap-6">
    <section class="md:col-span-2 card p-6">
      <h2 class="text-lg font-semibold mb-3">Graph view</h2>
      <div id="graph"></div>
    </section>
    <section class="card p-6">
      <h2 class="text-lg font-semibold mb-3">Answer</h2>
      <div id="answer-empty" class="text-white/40 text-sm">Run a query to see the routed kind, answer, and cited path.</div>
      <div id="answer" class="hidden space-y-3"></div>
      <div class="mt-4 pt-4 border-t border-white/10">
        <button id="run-eval" class="text-xs px-3 py-1.5 rounded border border-white/10 hover:bg-white/5 font-mono">Run eval harness</button>
        <pre id="eval-output" class="hidden mt-3 p-3 bg-black/40 rounded text-xs font-mono overflow-x-auto"></pre>
      </div>
    </section>
  </div>
</main>

<script>
const API = location.origin.replace(/:\d+$/, ':8001');
const $ = (id) => document.getElementById(id);

async function api(path, opts) {
  try {
    const res = await fetch(`${API}${path}`, opts);
    if (!res.ok) throw new Error(`${res.status}`);
    return await res.json();
  } catch (e) { return {__error: e.message}; }
}

async function checkBackend() {
  const r = await api('/health');
  $('backend-status').textContent = r.__error ? 'offline' : 'online';
  $('backend-status').className = r.__error ? 'text-red-400' : 'text-green-400';
}

let network = null;
async function renderGraph(citedNodes) {
  const data = await api('/api/graph?limit=200');
  if (data.__error) return;
  const citedIds = new Set(citedNodes.map(n => n.id));
  const nodes = data.nodes.map(n => ({
    id: n.id,
    label: n.name || n.id,
    color: citedIds.has(n.id)
      ? {background:'#7c5cff', border:'#22d3ee'}
      : {background:'#1c2030', border:'rgba(255,255,255,0.1)'},
    font: { color: '#e7ecf5', size: 12 },
    shape: 'dot',
    size: citedIds.has(n.id) ? 18 : 10,
  }));
  const edges = data.edges.map(e => ({
    from: e.from, to: e.to, label: e.type,
    color: { color: 'rgba(255,255,255,0.15)' },
    font: { color: '#9aa3b8', size: 10, strokeWidth: 0 },
    arrows: 'to',
  }));
  if (network) network.destroy();
  network = new vis.Network($('graph'), { nodes, edges }, {
    physics: { stabilization: true, barnesHut: { gravitationalConstant: -3000 }},
    nodes: { borderWidth: 2 },
    edges: { smooth: { type: 'continuous' }},
  });
}

function renderAnswer(data) {
  $('answer').innerHTML = `
    <div><span class="pill ${data.kind}">${data.kind.toUpperCase()}</span> <span class="text-white/40 text-xs ml-2">confidence ${(data.confidence*100).toFixed(0)}%</span></div>
    <div class="text-sm leading-relaxed">${data.answer}</div>
    <div class="pt-2 border-t border-white/10">
      <div class="text-xs uppercase tracking-wider text-white/40 mb-2 font-mono">Reasoning path</div>
      <div class="flex flex-wrap gap-1.5">
        ${data.reasoning_path.map(id => `<span class="px-2 py-0.5 rounded bg-white/5 text-xs font-mono">${id}</span>`).join('')}
      </div>
    </div>`;
  $('answer').classList.remove('hidden');
  $('answer-empty').classList.add('hidden');
  renderGraph(data.cited_nodes || []);
}

$('ask').addEventListener('click', async () => {
  const q = $('q').value.trim();
  if (!q) return;
  $('ask').textContent = 'Asking...';
  const data = await api('/api/query', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ question: q, max_hops: 2, k: 5 }),
  });
  $('ask').textContent = 'Ask';
  if (!data.__error) renderAnswer(data);
});

document.querySelectorAll('.example').forEach(b => {
  b.addEventListener('click', () => { $('q').value = b.textContent; $('ask').click(); });
});

$('run-eval').addEventListener('click', async () => {
  $('eval-output').classList.remove('hidden');
  $('eval-output').textContent = 'Running...';
  const data = await api('/api/eval/run');
  if (data.__error) { $('eval-output').textContent = 'Error: ' + data.__error; return; }
  $('eval-output').textContent =
    `Queries: ${data.n_queries}\n` +
    `Routing accuracy: ${(data.overall_routing_accuracy*100).toFixed(1)}%\n` +
    `Mean recall@k:    ${(data.recall_at_k_mean*100).toFixed(1)}%\n` +
    `Path cited rate:  ${(data.path_cited_rate*100).toFixed(1)}%\n\n` +
    'Per-kind:\n' +
    Object.entries(data.per_kind_routing_accuracy).map(([k,v]) => `  ${k.padEnd(14)} ${(v*100).toFixed(1)}%`).join('\n');
});

checkBackend();
renderGraph([]);
</script>
</body>
</html>
