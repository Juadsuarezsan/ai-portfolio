<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>P5 · Workflow Engine</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --accent:#7c5cff; --accent-2:#22d3ee; --accent-3:#f472b6; --bg:#07090f; }
  body { background: var(--bg); color:#e7ecf5; font-family:'Inter', system-ui, sans-serif; }
  .bg-stage { position:fixed; inset:0; z-index:-2; background:
    radial-gradient(1200px 700px at 80% -10%, rgba(124,92,255,0.22), transparent 60%),
    radial-gradient(1000px 600px at -10% 30%, rgba(34,211,238,0.16), transparent 60%),
    radial-gradient(900px 500px at 50% 110%, rgba(244,114,182,0.16), transparent 55%),
    linear-gradient(180deg,#06070d,#0a0e1c); }
  .card { background: rgba(18,20,28,0.7); border:1px solid rgba(255,255,255,0.08); border-radius:14px; backdrop-filter: blur(8px); }
  .brand { font-family:'JetBrains Mono',monospace; letter-spacing:0.2em; background: linear-gradient(90deg, var(--accent-2), var(--accent)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .severity-error { color: #ff5a72; border-color: rgba(255,90,114,0.4); }
  .severity-warn  { color: #fbbf24; border-color: rgba(251,191,36,0.4); }
  .node { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 14px; }
</style>
</head>
<body>
<div class="bg-stage"></div>

<nav class="border-b border-white/5 backdrop-blur sticky top-0 z-10 bg-black/40">
  <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
    <div class="brand text-sm">// P5 · WORKFLOW ENGINE</div>
    <div class="text-xs text-white/40 font-mono">backend: <span id="backend-status">checking...</span></div>
  </div>
</nav>

<main class="max-w-6xl mx-auto px-6 py-10 space-y-6">
  <header>
    <h1 class="text-4xl font-bold tracking-tight">Static DAG executor (Phase 1)</h1>
    <p class="text-white/60 mt-2 max-w-2xl">Edit the DAG, validate against the live tool registry, run it against mock MCP servers, and approve any HITL-gated nodes.</p>
  </header>

  <div class="grid md:grid-cols-3 gap-6">
    <!-- Tool registry -->
    <aside class="card p-6">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-white/70">Tool registry</h2>
        <button id="refresh-tools" class="text-xs text-white/50 hover:text-white">↻</button>
      </div>
      <div id="tools" class="space-y-2 text-xs"></div>
    </aside>

    <!-- DAG editor -->
    <section class="md:col-span-2 card p-6">
      <h2 class="text-lg font-semibold mb-3">DAG (JSON)</h2>
      <textarea id="dag" rows="14" class="w-full bg-black/40 border border-white/10 rounded p-3 text-xs font-mono leading-relaxed"></textarea>
      <div class="flex gap-3 mt-3">
        <button id="validate" class="px-4 py-2 rounded font-semibold text-sm border border-white/20 hover:bg-white/5">Validate</button>
        <button id="run-workflow" class="px-4 py-2 rounded font-semibold text-sm bg-gradient-to-r from-[#7c5cff] to-[#22d3ee] text-[#0b0f1f]">Run</button>
        <button id="run-eval" class="px-4 py-2 rounded font-semibold text-sm border border-white/20 hover:bg-white/5">Run eval</button>
      </div>
      <div id="findings" class="mt-4 space-y-1"></div>
      <pre id="run-output" class="hidden mt-4 p-3 bg-black/40 rounded text-xs font-mono overflow-x-auto"></pre>
    </section>
  </div>

  <!-- HITL queue -->
  <section class="card p-6">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-lg font-semibold">HITL approval queue</h2>
      <button id="refresh-hitl" class="text-xs px-3 py-1.5 rounded border border-white/10 hover:bg-white/5">Refresh</button>
    </div>
    <div id="hitl-queue" class="space-y-2"></div>
  </section>
</main>

<script>
const API = location.origin.replace(/:\d+$/, ':8004');
const $ = (id) => document.getElementById(id);
async function api(path, opts) { try { const r = await fetch(`${API}${path}`, opts); if (!r.ok) throw new Error(r.status); return await r.json(); } catch(e){return {__error:e.message};} }
async function checkBackend(){ const r=await api('/health'); $('backend-status').textContent=r.__error?'offline':'online'; $('backend-status').className=r.__error?'text-red-400':'text-green-400'; }

const SAMPLE = {
  goal: "Summarize a repo and post the summary to Slack.",
  nodes: [
    {id:"n1", name:"Repo summary", tool:"github", action:"get_repo_summary",
     params:{repo:"anthropics/claude-code"}, requires_approval:false, depends_on:[]},
    {id:"n2", name:"Post to Slack", tool:"slack", action:"post_message",
     params:{channel:"#ai", text:"{{n1.repo}} has {{n1.open_issues_count}} open issues."},
     requires_approval:true, depends_on:["n1"]}
  ],
  estimated_duration_minutes: 2
};
$('dag').value = JSON.stringify(SAMPLE, null, 2);

async function loadTools() {
  const d = await api('/api/tools');
  if (d.__error) { $('tools').innerHTML = `<div class="text-red-400">offline</div>`; return; }
  $('tools').innerHTML = d.tools.map(t => `
    <div class="border border-white/5 rounded p-2">
      <div class="font-mono text-white/80">${t.name}</div>
      <div class="text-white/40 text-[10px]">${t.description}</div>
      <div class="text-[10px] mt-1 ${t.idempotent ? 'text-green-400' : 'text-amber-400'}">${t.idempotent ? '◯ idempotent' : '⚠ side-effect (needs HITL)'}</div>
    </div>
  `).join('');
}

function renderFindings(findings) {
  $('findings').innerHTML = findings.map(f => `
    <div class="text-xs border rounded px-3 py-2 severity-${f.severity}">
      <span class="font-mono">[${f.severity.toUpperCase()}]</span> ${f.code}: ${f.message}${f.node_id ? ` (node: ${f.node_id})` : ''}
    </div>
  `).join('');
}

$('validate').addEventListener('click', async () => {
  let dag;
  try { dag = JSON.parse($('dag').value); } catch (e) { renderFindings([{severity:'error', code:'parse_error', message:e.message, node_id:null}]); return; }
  const d = await api('/api/workflows/validate', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({workflow_id:'ui', dag})});
  renderFindings(d.findings || []);
  if (d.accepted) $('findings').innerHTML += '<div class="text-xs text-green-400 font-mono">[OK] DAG accepted by validator</div>';
});

$('run-workflow').addEventListener('click', async () => {
  let dag;
  try { dag = JSON.parse($('dag').value); } catch (e) { alert('JSON error: '+e.message); return; }
  $('run-output').classList.remove('hidden'); $('run-output').textContent = 'Running...';
  const d = await api('/api/workflows/run', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({workflow_id:'ui-'+Date.now(), dag})});
  $('run-output').textContent = JSON.stringify(d, null, 2);
  loadHitl();
});

$('run-eval').addEventListener('click', async () => {
  $('run-output').classList.remove('hidden'); $('run-output').textContent = 'Running...';
  const d = await api('/api/eval/run');
  if (d.__error) { $('run-output').textContent = 'Error: '+d.__error; return; }
  $('run-output').textContent =
    `Validation accuracy: ${(d.validation_accuracy*100).toFixed(1)}%\n` +
    `Execution accuracy:  ${(d.execution_accuracy*100).toFixed(1)}%`;
});

async function loadHitl() {
  const d = await api('/api/hitl/pending');
  if (d.__error) { $('hitl-queue').innerHTML = `<div class="text-red-400 text-xs">offline</div>`; return; }
  if (!d.pending.length) { $('hitl-queue').innerHTML = '<div class="text-white/40 text-sm">No pending approvals.</div>'; return; }
  $('hitl-queue').innerHTML = d.pending.map(p => `
    <div class="node flex items-center justify-between">
      <div>
        <div class="font-mono text-sm text-white/80">${p.workflow_id} / ${p.node_id}</div>
        <pre class="text-[11px] text-white/50 mt-1 max-w-xl overflow-x-auto">${JSON.stringify(p.payload?.resolved_params || {}, null, 2)}</pre>
      </div>
      <div class="flex gap-2">
        <button class="hitl px-3 py-1.5 rounded border border-green-400/40 text-green-400 hover:bg-green-400/10 text-xs"
                data-wf="${p.workflow_id}" data-n="${p.node_id}" data-act="1">Approve</button>
        <button class="hitl px-3 py-1.5 rounded border border-red-400/40 text-red-400 hover:bg-red-400/10 text-xs"
                data-wf="${p.workflow_id}" data-n="${p.node_id}" data-act="0">Reject</button>
      </div>
    </div>
  `).join('');
}

$('hitl-queue').addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-wf]');
  if (!b) return;
  await api(`/api/workflows/${b.dataset.wf}/nodes/${b.dataset.n}/resolve`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({approved: b.dataset.act === '1'}),
  });
  loadHitl();
});

$('refresh-hitl').addEventListener('click', loadHitl);
$('refresh-tools').addEventListener('click', loadTools);

checkBackend(); loadTools(); loadHitl();
</script>
</body>
</html>
